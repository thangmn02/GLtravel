<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="140" viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="260" height="140" fill="url(#bgGradient)"/>
  
  <!-- Mountain icon -->
  <g transform="translate(130, 70)">
    <path d="M -30 10 L -10 -20 L 0 -5 L 10 -20 L 30 10 Z" 
          fill="#c0c0c0" 
          stroke="#a0a0a0" 
          stroke-width="1"/>
    <!-- Sun -->
    <circle cx="-15" cy="-15" r="8" fill="#d0d0d0"/>
  </g>
  
  <!-- Text -->
  <text x="130" y="100" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        fill="#888888" 
        text-anchor="middle">
    Gia Lai
  </text>
</svg>
